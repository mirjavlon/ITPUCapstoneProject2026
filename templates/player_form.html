{% extends "base.html" %}
{% block title %}{{ 'Edit player' if player else 'Add player' }} · Mini Football{% endblock %}
{% block content %}<section class="dashboard-head"><div class="container-xl py-5"><a class="back-link" href="/dashboard/teams/{{ team.id }}/edit">← {{ team.name }}</a><div class="mt-3"><span class="section-kicker">ROSTER</span><h1 class="display-title">{{ 'Edit player' if player else 'Add player' }}</h1></div></div></section><div class="container-xl py-5"><div class="form-narrow panel-card">{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}<form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div><label class="form-label" for="name">Player name</label><input class="form-control"
       id="name"
       name="name"
       required
       minlength="2"
       maxlength="100"
       value="{{ form.name if form.name is defined else player.name if player else '' }}"></div><div class="row g-3"><div class="col-sm-6"><label class="form-label" for="jersey_number">Shirt number</label><input class="form-control"
       id="jersey_number"
       name="jersey_number"
       type="number"
       min="1"
       max="99"
       value="{{ form.jersey_number if form.jersey_number is defined else player.jersey_number if player and player.jersey_number else '' }}"></div><div class="col-sm-6"><label class="form-label" for="position">Position</label><select class="form-select" id="position" name="position"><option value="">Not set</option>{% for value, label in [('GK','Goalkeeper'),('DEF','Defender'),('MID','Midfielder'),('FWD','Forward')] %}<option value="{{ value }}"
        {% if (form.position if form.position is defined else player.position if player else '') == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div></div><button class="btn btn-accent" type="submit">{{ 'Save player' if player else 'Add to roster' }}</button></form>{% if player %}<form method="post"
      action="/dashboard/players/{{ player.id }}/delete"
      class="mt-4"
      data-confirm="Remove this player from the roster?"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-link text-danger p-0" type="submit">Remove player</button></form>{% endif %}</div></div>{% endblock %}
